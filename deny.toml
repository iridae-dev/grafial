# cargo-deny configuration for Grafial.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Tracked: bump grafial-python PyO3 past 0.29 when bindings are migrated.
ignore = [
  { id = "RUSTSEC-2025-0020", reason = "PyO3 0.21; upgrade planned with bindings migration to >=0.29" },
  { id = "RUSTSEC-2026-0177", reason = "PyO3 0.21; upgrade planned with bindings migration to >=0.29" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is feature-complete; optional grafial-core feature only" },
  { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch via rayon; await upstream rayon bump" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
