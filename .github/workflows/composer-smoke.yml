name: Composer Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  # Also usable as a reusable job after deploy pipelines call it with COMPOSER_URL.
  workflow_call:
    inputs:
      composer_url:
        description: "Composer base URL to smoke-test"
        type: string
        required: false
        default: "https://grafial.iridae.com/"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.50.1
          npx playwright install --with-deps chromium

      - name: Smoke test Composer
        env:
          COMPOSER_URL: ${{ inputs.composer_url || 'https://grafial.iridae.com/' }}
        run: node scripts/composer_smoke.mjs
