name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0 or v0.2.0)"
        required: true
        default: "0.2.0"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  set-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Set version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="${{ github.event.inputs.version }}"
            ver="${ver#v}"
          else
            ver="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"

  test-gate:
    needs: set-version
    uses: ./.github/workflows/phase6-release-gate.yml

  build-binaries:
    needs: [set-version, test-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-unknown-linux-gnu
            ext: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: aarch64-apple-darwin
            ext: tar.gz
          - runner: macos-14
            target: x86_64-apple-darwin
            suffix: x86_64-apple-darwin
            ext: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version in manifests
        shell: bash
        env:
          VERSION: ${{ needs.set-version.outputs.version }}
        run: ./scripts/set_version.sh

      - name: Assert versions agree with release tag
        shell: bash
        env:
          EXPECT_VERSION: ${{ needs.set-version.outputs.version }}
        run: ./scripts/assert_versions.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build CLI and LSP
        run: |
          cargo build -p grafial-cli -p grafial-lsp --release --target ${{ matrix.target }}

      - name: Strip binaries
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/grafial 2>/dev/null || true
          strip target/${{ matrix.target }}/release/grafial-lsp 2>/dev/null || true

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.set-version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          BIN_DIR="target/${{ matrix.target }}/release"
          tar czvf "grafial-$VERSION-$SUFFIX.tar.gz" -C "$BIN_DIR" grafial
          tar czvf "grafial-lsp-$VERSION-$SUFFIX.tar.gz" -C "$BIN_DIR" grafial-lsp

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.set-version.outputs.version }}"
          $SUFFIX = "${{ matrix.suffix }}"
          $BIN_DIR = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$BIN_DIR/grafial.exe" -DestinationPath "grafial-$VERSION-$SUFFIX.zip"
          Compress-Archive -Path "$BIN_DIR/grafial-lsp.exe" -DestinationPath "grafial-lsp-$VERSION-$SUFFIX.zip"

      - name: Install-test CLI archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.set-version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          mkdir -p /tmp/grafial-cli-test
          tar xzvf "grafial-$VERSION-$SUFFIX.tar.gz" -C /tmp/grafial-cli-test
          /tmp/grafial-cli-test/grafial --version | tee /tmp/cli-version.txt
          grep -F "$VERSION" /tmp/cli-version.txt
          /tmp/grafial-cli-test/grafial crates/grafial-examples/minimal.grafial --flow MinimalFlow
          mkdir -p /tmp/grafial-lsp-test
          tar xzvf "grafial-lsp-$VERSION-$SUFFIX.tar.gz" -C /tmp/grafial-lsp-test
          test -x /tmp/grafial-lsp-test/grafial-lsp

      - name: Install-test CLI archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.set-version.outputs.version }}"
          $SUFFIX = "${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force -Path "$env:TEMP\grafial-cli-test" | Out-Null
          Expand-Archive -Path "grafial-$VERSION-$SUFFIX.zip" -DestinationPath "$env:TEMP\grafial-cli-test" -Force
          $cli = Join-Path $env:TEMP "grafial-cli-test\grafial.exe"
          & $cli --version | Tee-Object -FilePath "$env:TEMP\cli-version.txt"
          if (-not (Select-String -Path "$env:TEMP\cli-version.txt" -Pattern $VERSION -SimpleMatch -Quiet)) {
            throw "CLI version missing $VERSION"
          }
          & $cli crates\grafial-examples\minimal.grafial --flow MinimalFlow
          New-Item -ItemType Directory -Force -Path "$env:TEMP\grafial-lsp-test" | Out-Null
          Expand-Archive -Path "grafial-lsp-$VERSION-$SUFFIX.zip" -DestinationPath "$env:TEMP\grafial-lsp-test" -Force
          if (-not (Test-Path "$env:TEMP\grafial-lsp-test\grafial-lsp.exe")) { throw "LSP binary missing" }

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grafial-cli-${{ matrix.suffix }}
          path: |
            grafial-${{ needs.set-version.outputs.version }}-${{ matrix.suffix }}.*

      - name: Upload LSP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grafial-lsp-${{ matrix.suffix }}
          path: |
            grafial-lsp-${{ needs.set-version.outputs.version }}-${{ matrix.suffix }}.*

  build-wheels:
    needs: [set-version, test-gate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version in manifests
        shell: bash
        env:
          VERSION: ${{ needs.set-version.outputs.version }}
        run: ./scripts/set_version.sh

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel (and sdist once on Linux/3.11)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          # manylinux builds are containerized: host setup-python is ignored.
          # Pin the interpreter explicitly for each matrix cell.
          args: >-
            --release
            --out dist
            -i python${{ matrix.python-version }}
            ${{ (matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.11') && '--sdist' || '' }}
          manylinux: ${{ matrix.os == 'ubuntu-22.04' && '2_17' || 'off' }}
          working-directory: crates/grafial-python
          sccache: "true"

      - name: Install-test wheel on matching interpreter
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/grafial-wheel-test"
          if [[ -f "$RUNNER_TEMP/grafial-wheel-test/bin/activate" ]]; then
            source "$RUNNER_TEMP/grafial-wheel-test/bin/activate"
          else
            source "$RUNNER_TEMP/grafial-wheel-test/Scripts/activate"
          fi
          python -m pip install --upgrade pip
          python -m pip install crates/grafial-python/dist/*.whl
          python - <<'PY'
          import grafial, pathlib, sys
          expected = tuple(map(int, "${{ matrix.python-version }}".split(".")))
          assert sys.version_info[:2] == expected, (sys.version_info[:2], expected)
          src = pathlib.Path("crates/grafial-examples/minimal.grafial").read_text()
          program = grafial.compile(src)
          ctx = grafial.run_flow(program, "MinimalFlow")
          assert "total" in ctx.metrics, "expected metric 'total' from MinimalFlow"
          assert ctx.get_graph("output") is not None, "expected export graph 'output'"
          print("wheel ok", sys.version.split()[0], sorted(ctx.metrics.keys()))
          PY

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: crates/grafial-python/dist/*

  build-composer:
    needs: [set-version, test-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version in manifests
        env:
          VERSION: ${{ needs.set-version.outputs.version }}
        run: ./scripts/set_version.sh

      - name: Install Rust toolchain with wasm target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install pinned wasm-pack
        run: ./scripts/install_wasm_pack.sh

      - name: Build static Composer bundle
        run: ./scripts/build_composer_dist.sh dist/composer

      - name: Install-test Composer static bundle (Playwright headless)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("dist/composer")
          assert (root / "index.html").is_file()
          assert (root / "pkg" / "grafial_wasm_bg.wasm").is_file()
          assert (root / "pkg" / "grafial_wasm.js").is_file()
          assert list((root / "examples").glob("*.grafial")), "examples missing"
          print("composer files ok")
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
          python3 -m http.server -d dist/composer 8765 >/tmp/composer-http.log 2>&1 &
          echo $! > /tmp/composer-http.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && break
            sleep 0.5
          done
          COMPOSER_URL=http://127.0.0.1:8765/ node scripts/composer_smoke.mjs
          kill "$(cat /tmp/composer-http.pid)" || true

      - name: Package composer archive
        run: |
          VERSION="${{ needs.set-version.outputs.version }}"
          tar czvf "grafial-composer-$VERSION.tar.gz" -C dist composer

      - name: Upload composer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grafial-composer
          path: grafial-composer-${{ needs.set-version.outputs.version }}.tar.gz

  release:
    needs: [set-version, build-binaries, build-wheels, build-composer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout for dependency SBOM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          find . -type f ! -name 'SHA256SUMS' ! -name '*.cdx.json' ! -name '*.sigstore.json' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Generate CycloneDX dependency SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign checksum manifest (Sigstore)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle artifacts/SHA256SUMS.sigstore.json \
            artifacts/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/*

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && needs.set-version.outputs.tag || github.ref_name }}
          name: Grafial ${{ needs.set-version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    needs: [set-version, test-gate, build-wheels]
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_PYPI == 'true'
    permissions:
      id-token: write
      contents: read
    # Optional: set this to match a PyPI trusted-publisher "Environment" name.
    # Leave unset when publishing with PYPI_API_TOKEN (as in v0.2.0).
    # environment: pypi
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List packages to upload
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          # v0.2.0 published via API token (maturin publish + PYPI_API_TOKEN).
          # Trusted publishing (OIDC) only works after a matching publisher is
          # registered on PyPI; until then keep the token path.
          password: ${{ secrets.PYPI_API_TOKEN }}
