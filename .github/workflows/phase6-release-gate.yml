name: All Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Assert workspace versions agree
        run: ./scripts/assert_versions.sh

      - name: Dependency policy (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

      - name: Run Phase 6 release gate
        run: ./scripts/phase6_release_gate.sh

      - name: Run strict clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run feature-gated engine tests (parallel, vectorized)
        run: |
          cargo test -p grafial-core --features "parallel vectorized"
          cargo test -p grafial-tests --features parallel

      - name: Benchmark regression vs baseline
        run: ./scripts/check_bench_baseline.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust MSRV 1.83
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.83"

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Build and test on MSRV
        run: |
          cargo +1.83 test --workspace --locked

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain with wasm target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Run grafial-wasm native API tests
        run: cargo test -p grafial-wasm

      - name: Build grafial-wasm for wasm32
        run: cargo build -p grafial-wasm --target wasm32-unknown-unknown --release

      - name: Install pinned wasm-pack
        run: ./scripts/install_wasm_pack.sh

      - name: Build node package for composer tests
        working-directory: crates/grafial-wasm
        run: wasm-pack build --target nodejs --out-dir ../../webapp/tests/pkg-node

      - name: Run all composer headless tests
        run: node --test webapp/tests/*.test.mjs

  python-bindings-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Build Python extension and run pytest
        working-directory: crates/grafial-python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest
          export PYO3_PYTHON="$PWD/.venv/bin/python"
          maturin develop --release
          pytest tests -q
