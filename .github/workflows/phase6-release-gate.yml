name: All Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Run Phase 6 release gate
        run: ./scripts/phase6_release_gate.sh

      - name: Run strict clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run feature-gated engine tests (parallel, vectorized)
        run: |
          cargo test -p grafial-core --features "parallel vectorized"
          cargo test -p grafial-tests --features parallel

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Run grafial-wasm native API tests
        run: cargo test -p grafial-wasm

      - name: Build grafial-wasm for wasm32
        run: cargo build -p grafial-wasm --target wasm32-unknown-unknown --release

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build node package for composer round-trip tests
        working-directory: crates/grafial-wasm
        run: wasm-pack build --target nodejs --out-dir ../../webapp/tests/pkg-node

      - name: Run composer headless tests
        run: node --test webapp/tests/pure.test.mjs webapp/tests/roundtrip.test.mjs

  python-bindings-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build Python extension and run pytest
        working-directory: crates/grafial-python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest
          export PYO3_PYTHON="$PWD/.venv/bin/python"
          maturin develop --release
          pytest tests -q
