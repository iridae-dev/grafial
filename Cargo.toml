[workspace]
members = [
    "crates/grafial-core",
    "crates/grafial-frontend",
    "crates/grafial-ir",
    "crates/grafial-cli",
    "crates/grafial-python",
    "crates/grafial-tests",
    "crates/grafial-benches",
    "crates/grafial-lsp",
    "crates/grafial-wasm",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/iridae-dev/grafial"
keywords = ["bayesian", "graph", "dsl"]
categories = ["science", "parsing"]

[workspace.dependencies]
thiserror = "1"
pest = "2"
pest_derive = "2"
smallvec = "1.15"
rustc-hash = "2"
lazy_static = "1.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep bincode 1 until snapshot format/API migration (Dependabot #8).
bincode = "1"
rayon = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
num_cpus = "1"
pyo3 = "0.22"
wasm-bindgen = "0.2"
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-jit = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
cranelift-object = "0.134"

[workspace.dependencies.pretty_assertions]
version = "1"

[workspace.dependencies.proptest]
version = "1"

[workspace.dependencies.criterion]
version = "0.5"
features = ["html_reports"]
